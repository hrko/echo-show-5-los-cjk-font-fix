[project]
name = "echo-show-lineageos-variable-fonts"
version = "0.1.0"
description = "Build and verify shared variable-font recovery ZIPs for Echo Show checkers, cronos and crown running LineageOS 18.1"
requires-python = ">=3.12"
dependencies = ["brotli>=1.1", "fonttools>=4.60", "ext4>=1.0"]

[tool.uv]
package = false

[tool.ruff]
# Use the default lint rules of the Ruff version pinned in mise.toml.

[tool.ty.environment]
extra-paths = ["scripts"]

[tool.ty.src]
include = ["scripts", "recovery", "tests"]
