name: Build and publish release

# Run from main and create the version tag at the dispatched commit.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0 or v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Require main and validate the version
        id: version
        env:
          REF: ${{ github.ref }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$REF" != refs/heads/main ]]; then
            echo '::error::Run this workflow on main: gh workflow run release.yml --ref main -f version=0.1.0'
            exit 1
          fi
          version="${VERSION#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Version must have the form 0.1.0 or v0.1.0.'
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check out the exact workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate the version increment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh api --paginate --slurp "repos/$GH_REPO/releases" > "$RUNNER_TEMP/version-releases.json"
          python3 scripts/validate_release_version.py "$TAG" "$RUNNER_TEMP/version-releases.json"

      - name: Create or verify the version tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Listing refs distinguishes an absent tag from an API failure.
          gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/$TAG" > "$RUNNER_TEMP/tag-refs.json"
          tag_ref=$(jq -sc --arg ref "refs/tags/$TAG" '[.[][] | select(.ref == $ref)] | first // empty' "$RUNNER_TEMP/tag-refs.json")
          if [[ -z "$tag_ref" ]]; then
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
          fi
          encoded_ref=$(jq -rn --arg ref "refs/tags/$TAG" '$ref | @uri')
          current_sha=$(gh api "repos/$GH_REPO/commits/$encoded_ref" --jq '.sha')
          if [[ "$current_sha" != "$GITHUB_SHA" ]]; then
            echo '::error::The version tag already points to a different commit. Rerun the original workflow run or choose a new version.'
            exit 1
          fi

      - name: Create or find the draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Listing releases distinguishes an absent release from an API failure.
          gh api --paginate "repos/$GH_REPO/releases" > "$RUNNER_TEMP/releases.json"
          release=$(jq -sc --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)] | first // empty' "$RUNNER_TEMP/releases.json")
          if [[ -z "$release" ]]; then
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --generate-notes
            release=$(gh release view "$TAG" --json databaseId,isDraft | jq '{id: .databaseId, draft: .isDraft}')
          fi
          jq -e '.draft == true' <<< "$release" > /dev/null
          echo "id=$(jq -r '.id' <<< "$release")" >> "$GITHUB_OUTPUT"

      - name: Set up mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false

      - name: Fetch and verify build inputs
        run: mise run fetch-assets

      - name: Build and validate ZIPs
        run: mise run build

      - name: Run tests
        run: mise run test

      - name: Attest every release asset
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/cronos-cjk-fonts-install.zip
            dist/cronos-cjk-fonts-restore.zip
            dist/cronos-latin-fonts-install.zip
            dist/cronos-latin-fonts-restore.zip
            dist/SHA256SUMS.txt
            dist/cjk-verification.json
            dist/latin-verification.json

      - name: Upload and verify assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          endpoint="repos/$GH_REPO/releases/$RELEASE_ID"
          gh api "$endpoint" > "$RUNNER_TEMP/release.json"
          jq -e --arg tag "$TAG" '.draft == true and .tag_name == $tag' "$RUNNER_TEMP/release.json" > /dev/null
          assets=(dist/cronos-cjk-fonts-install.zip dist/cronos-cjk-fonts-restore.zip dist/cronos-latin-fonts-install.zip dist/cronos-latin-fonts-restore.zip dist/SHA256SUMS.txt dist/cjk-verification.json dist/latin-verification.json)
          # A failed run can be retried while the release is still a draft.
          gh release upload "$TAG" "${assets[@]}" --clobber
          gh api "$endpoint/assets" --paginate > "$RUNNER_TEMP/release-assets.json"
          for asset in "${assets[@]}"; do
            digest="sha256:$(sha256sum "$asset" | cut -d ' ' -f 1)"
            jq -se --arg name "${asset##*/}" --arg digest "$digest" \
              '[.[][] | select(.name == $name and .state == "uploaded" and .digest == $digest)] | length == 1' \
              "$RUNNER_TEMP/release-assets.json" > /dev/null
          done
          # Refuse to publish additional, unattested files added manually.
          jq -se '[.[][]] | length == 7' "$RUNNER_TEMP/release-assets.json" > /dev/null
          encoded_ref=$(jq -rn --arg ref "refs/tags/$TAG" '$ref | @uri')
          current_sha=$(gh api "repos/$GH_REPO/commits/$encoded_ref" --jq '.sha')
          test "$current_sha" = "$GITHUB_SHA"
          gh api "$endpoint" > "$RUNNER_TEMP/release.json"
          jq -e --arg tag "$TAG" '.draft == true and .tag_name == $tag' "$RUNNER_TEMP/release.json" > /dev/null
          # Publish last: immutable releases lock their tag and assets at this point.
          gh api --paginate --slurp "repos/$GH_REPO/releases" > "$RUNNER_TEMP/version-releases.json"
          python3 scripts/validate_release_version.py "$TAG" "$RUNNER_TEMP/version-releases.json"
          gh api --method PATCH "$endpoint" -F draft=false --jq '.html_url'
